name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Mirrors requires-python (>=3.10,<3.13): lxml (via myfitnesspal)
        # has no wheels for 3.13+.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked package with dev dependencies
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --extra dev pytest -q
